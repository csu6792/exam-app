<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>專業測驗與閱讀系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        /* iOS 官方系統色彩規範 */
        :root {
            --ios-bg: #f2f2f7;                 /* iOS Grouped Background */
            --ios-surface: #ffffff;            /* iOS Secondary System Background */
            --ios-sub-bg: #fafafa;
            --text-primary: #000000;           /* iOS Primary Label */
            --text-secondary: #3c3c4399;       /* iOS Secondary Label */
            --text-muted: #3c3c434d;           /* iOS Tertiary Label */
            --brand-primary: #007aff;          /* iOS System Blue */
            --brand-hover: #0062cc;
            --brand-inactive: #8e8e93;         /* iOS Tab 灰 */
            --status-success: #34c759;         /* iOS System Green */
            --status-success-bg: #f2fbf4;
            --status-error: #ff3b30;           /* iOS System Red */
            --status-error-bg: #fff5f5;
            --status-warning: #ff9500;         /* iOS System Orange */
            --status-warning-bg: #fff9f0;
            --border-light: #3c3c432e;         /* iOS Separator (0.5px 質感) */
            --transition-ios: all 0.28s cubic-bezier(0.25, 1, 0.5, 1); /* iOS 彈性動畫 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* iOS 導覽列 (Navigation Bar) */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 16px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            border-bottom: 0.5px solid var(--border-light);
            z-index: 100;
            flex-shrink: 0;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: calc(140px + env(safe-area-inset-bottom));
            scroll-behavior: smooth;
        }

        /* 頂層 Tab 分頁內容區塊控制 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* iOS 工具列 (下方懸浮動態按鈕區) */
        .bottom-nav {
            position: fixed;
            bottom: calc(50px + env(safe-area-inset-bottom)); /* 移至 Tab Bar 之上 */
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(242,242,247,0.95) 80%, rgba(242,242,247,0));
            padding: 16px;
            z-index: 150;
            display: none;
        }

        /* iOS 底部固定導覽列 (Global Tab Bar) */
        .ios-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(50px + env(safe-area-inset-bottom));
            background: rgba(249, 249, 249, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--border-light);
            display: flex;
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--brand-inactive);
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .tab-item.active { color: var(--brand-primary); }
        .tab-icon { width: 22px; height: 22px; margin-bottom: 2px; fill: none; stroke: currentColor; stroke-width: 2.2; }
        .tab-label { font-size: 10px; font-weight: 500; }

        /* iOS 電子書獨立滿版閱讀視窗 (Apple Books 風格) */
        .ebook-window {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f2f2f7; 
            z-index: 500;
            display: none; 
            flex-direction: column;
        }
        .reader-header {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-light);
        }
        .btn-close {
            color: var(--brand-primary);
            font-size: 16px; font-weight: 500; background: none; border: none; cursor: pointer;
        }
        .reader-title {
            font-size: 15px; font-weight: 600; max-width: 55%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            letter-spacing: -0.2px;
        }
        .reader-viewport {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }
        #pdf-canvas {
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border-radius: 6px;
            max-width: 100%;
        }
        .reader-footer {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 0.5px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .page-controls {
            display: flex; width: 100%; justify-content: space-between; align-items: center;
        }
        .btn-page {
            width: 38px; height: 38px; border-radius: 50%; background: #e5e5ea;
            border: none; color: var(--text-primary); font-size: 15px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s;
        }
        .btn-page:active { background: #d1d1d6; }
        .ios-slider {
            -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
            background: #d1d1d6; outline: none;
        }
        .ios-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 26px; height: 26px;
            border-radius: 50%; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.18); cursor: pointer;
        }

        /* 測驗區架構 */
        .section { display: none; opacity: 0; }
        .section.active { display: block; opacity: 1; animation: iosSlideUp 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes iosSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* iOS Inset Grouped 卡片設計 */
        .app-card {
            background: var(--ios-surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: none;
            border: none;
        }

        /* iOS 表單小標題規範 */
        .card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.2px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }

        /* iOS 系統級滿版按鈕 */
        .btn-action {
            width: 100%;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            color: #ffffff;
            background-color: var(--brand-primary);
            transition: var(--transition-ios);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: -0.4px;
        }
        .btn-action:active { opacity: 0.7; transform: scale(0.99); }
        
        /* iOS 次要邊框按鈕 */
        .btn-secondary {
            background-color: var(--ios-surface);
            color: var(--brand-primary);
            border: none;
        }
        .btn-secondary:active { background-color: #f2f2f7; }

        /* iOS 分組橫欄 (Cell Row) */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 0.5px solid var(--border-light);
        }
        .setting-row:last-child { border-bottom: none; padding-bottom: 0; }
        .setting-row > div:first-child { flex: 1; min-width: 0; }
        
        /* 100% 擬真 iOS UISwitch 規格 */
        .toggle-switch { 
            position: relative; 
            display: inline-block; 
            width: 51px; 
            height: 31px; 
            flex-shrink: 0;
            margin-left: 16px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e3e3e5;
            border-radius: 31px;
            transition: all 0.25s ease-in-out;
        }
        .slider:before {
            position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 3px 1px rgba(0,0,0,0.06);
        }
        input:checked + .slider { background-color: var(--status-success); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* iOS 數字輸入框 field 樣式 */
        .input-number-wrapper {
            display: flex;
            align-items: center;
            background: #eeeeee;
            border-radius: 8px;
            padding: 6px 12px;
            flex-shrink: 0;
            margin-left: 16px;
        }
        .input-number-wrapper input {
            width: 50px;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
        }

        /* iOS 選擇題 Cell 設計 */
        .option-container {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-radius: 10px;
            background-color: var(--ios-sub-bg);
            border: 0.5px solid var(--border-light);
            transition: var(--transition-ios);
            cursor: pointer;
        }
        .option-container input[type="radio"] { display: none; }
        
        .option-badge {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid #c6c6c8;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-right: 12px;
            transition: var(--transition-ios);
        }
        .option-text { font-size: 15px; color: var(--text-primary); line-height: 1.4; }

        /* iOS 點選活化狀態 */
        .option-container.selected {
            border-color: var(--brand-primary);
            background-color: #f2f8ff;
        }
        .option-container.selected .option-badge {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #ffffff;
        }

        .option-container.correct {
            border-color: var(--status-success) !important;
            background-color: var(--status-success-bg) !important;
        }
        .option-container.correct .option-badge {
            background-color: var(--status-success) !important;
            border-color: var(--status-success) !important;
            color: #ffffff !important;
        }

        .option-container.wrong {
            border-color: var(--status-error) !important;
            background-color: var(--status-error-bg) !important;
        }
        .option-container.wrong .option-badge {
            background-color: var(--status-error) !important;
            border-color: var(--status-error) !important;
            color: #ffffff !important;
        }

        /* iOS 系統提示橫幅 */
        .status-banner {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .status-banner.show { display: flex; }
        .status-banner.correct { background-color: var(--status-success-bg); color: var(--status-success); }
        .status-banner.wrong { background-color: var(--status-error-bg); color: var(--status-error); }
        .status-banner.unanswered { background-color: var(--status-warning-bg); color: var(--status-warning); }

        /* iOS 骨架屏 */
        .skeleton-card { padding: 16px; background: var(--ios-surface); border-radius: 12px; margin-bottom: 24px;}
        .skeleton-line { background: linear-gradient(90deg, #e5e5ea 25%, #d1d1d6 50%, #e5e5ea 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 4px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* iOS 得分大數字圓環感 */
        .score-circle-view {
            text-align: center;
            padding: 24px 0;
        }
        .score-num {
            font-size: 72px;
            font-weight: 700;
            color: var(--brand-primary);
            line-height: 1;
            letter-spacing: -2px;
        }
        .score-lbl { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px;}

        /* iOS 簡潔 SF Symbols 風格圖示 */
        .svg-icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* iOS Muted Footer */
        .app-footer {
            margin-top: 48px;
            padding: 24px 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        .footer-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            color: var(--status-success);
            font-size: 11px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--status-success);
            border-radius: 50%;
            display: inline-block;
        }
        .footer-meta { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
    </style>
</head>

            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>
    
    <div class="bottom-nav" id="action-bar-quiz">
        <button class="btn-action" onclick="submitQuiz()">
            <span>提交試卷並評分</span>
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </button>
    </div>

    <div class="bottom-nav" id="action-bar-result">
        <button class="btn-action btn-secondary" onclick="location.reload()">
            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            <span>開始新測驗</span>
        </button>
    </div>

    <nav class="ios-tab-bar">
        <div class="tab-item active" id="tab-btn-reading" onclick="switchGlobalTab('reading')">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span class="tab-label">教科書</span>
        </div>
        <div class="tab-item" id="tab-btn-quiz" onclick="switchGlobalTab('quiz')">
            <svg class="tab-icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            <span class="tab-label">模擬測驗</span>
        </div>
    </nav>

    <div id="ebook-reader-window" class="ebook-window">
        <div class="reader-header">
            <button class="btn-close" onclick="closeEbook()">✕ 關閉</button>
            <div class="reader-title" id="reader-book-title">加載中...</div>
            <div style="font-size: 13px; color: var(--text-secondary); font-weight: 500;" id="reader-page-indicator">0 / 0</div>
        </div>
        
        <div class="reader-viewport" id="viewport-area">
            <canvas id="pdf-canvas"></canvas>
        </div>
        
        <div class="reader-footer">
            <input type="range" class="ios-slider" id="reader-slider" min="1" max="1" value="1" oninput="handleSliderInput(this.value)">
            <div class="page-controls">
                <button class="btn-page" onclick="movePage(-1)">◀</button>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500; letter-spacing: -0.1px;">已自動記憶閱讀進度</span>
                <button class="btn-page" onclick="movePage(1)">▶</button>
            </div>
        </div>
    </div>

<script>
    // 指定 PDF.js 的 Worker 執行緒路徑
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let loadedBanks = {}; 
    let currentQuiz = []; 
    let activeGlobalTab = 'reading'; // 當前全局 Tab ('reading' 或 'quiz')
    let activeQuizSection = 'stage-loading'; // 當前測驗區小進度

    let currentPdfDoc = null;
    let currentPdfPage = 1;
    let currentPdfUrl = ''; 
    let isRenderingPage = false;

    // ==================== 🔄 全局 Tab Bar 切換邏輯 ====================
    function switchGlobalTab(tabId) {
        activeGlobalTab = tabId;
        
        // 更新 Tab 狀態樣式
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-btn-${tabId}`).classList.add('active');
        
        // 切換主要視窗內容
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-content-${tabId}`).classList.add('active');
        
        const navTitle = document.getElementById('nav-title');
        document.querySelectorAll('.bottom-nav').forEach(el => el.style.display = 'none');
        
        if (tabId === 'reading') {
            navTitle.innerText = "教科書閱讀";
        } else {
            navTitle.innerText = "專業測驗系統";
            restoreQuizActionBar(); // 還原測驗分組對應的懸浮按鈕列
        }
        document.getElementById('main-content').scrollTo(0, 0);
    }

    // 覆蓋並整合原始測驗的 showSection
    function showSection(stageId) {
        activeQuizSection = stageId;
        
        // 如果現在是在測驗頁，先清空按鈕
        if (activeGlobalTab === 'quiz') {
            document.querySelectorAll('.bottom-nav').forEach(el => el.style.display = 'none');
        }
        
        document.querySelectorAll('#tab-content-quiz .section').forEach(el => el.classList.remove('active'));
        document.getElementById(stageId).classList.add('active');
        
        if (stageId === 'stage-result') {
            document.getElementById('stage-quiz').classList.add('active'); 
        }
        
        if (activeGlobalTab === 'quiz') {
            restoreQuizActionBar();
        }
        document.getElementById('main-content').scrollTo(0, 0);
    }

    // 依據測驗階段精準顯現對應懸浮按鈕
    function restoreQuizActionBar() {
        if (activeQuizSection === 'stage-config') document.getElementById('action-bar-config').style.display = 'block';
        if (activeQuizSection === 'stage-quiz') document.getElementById('action-bar-quiz').style.display = 'block';
        if (activeQuizSection === 'stage-result') document.getElementById('action-bar-result').style.display = 'block';
    }

    // ==================== 📖 PDF 電子書閱讀與自動首頁封面縮圖 ====================
    async function openEbook(pdfUrl, bookTitle) {
        currentPdfUrl = pdfUrl; 
        const readerWin = document.getElementById('ebook-reader-window');
        const titleEl = document.getElementById('reader-book-title');
        const indicatorEl = document.getElementById('reader-page-indicator');
        
        titleEl.innerText = bookTitle;
        indicatorEl.innerText = "載入中...";
        readerWin.style.display = 'flex'; 

        try {
            currentPdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            
            // 讀取本機緩存的歷史頁碼進度
            const savedPage = localStorage.getItem('ebook_progress_' + pdfUrl);
            if (savedPage) {
                currentPdfPage = parseInt(savedPage);
                if (currentPdfPage > currentPdfDoc.numPages || currentPdfPage < 1) {
                    currentPdfPage = 1;
                }
            } else {
                currentPdfPage = 1;
            }
            
            const slider = document.getElementById('reader-slider');
            slider.max = currentPdfDoc.numPages;
            slider.value = currentPdfPage;

            renderBookPage(currentPdfPage);
        } catch (error) {
            alert("電子書載入失敗，請確認 pdf 檔案放置路徑是否正確。");
            closeEbook();
        }
    }

    async function renderBookPage(pageNumber) {
        if (!currentPdfDoc || isRenderingPage) return;
        isRenderingPage = true;

        try {
            const page = await currentPdfDoc.getPage(pageNumber);
            const canvas = document.getElementById('pdf-canvas');
            const ctx = canvas.getContext('2d');
            const viewportArea = document.getElementById('viewport-area');

            // 依據容器寬度實施動態 RWD 高清縮放
            const containerWidth = viewportArea.clientWidth - 24; 
            const unscaledViewport = page.getViewport({ scale: 1 });
            const dynamicScale = containerWidth / unscaledViewport.width;
            
            const compiledViewport = page.getViewport({ scale: dynamicScale });
            canvas.height = compiledViewport.height;
            canvas.width = compiledViewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: compiledViewport
            };
            await page.render(renderContext).promise;

            document.getElementById('reader-page-indicator').innerText = `${pageNumber} / ${currentPdfDoc.numPages}`;
            document.getElementById('reader-slider').value = pageNumber;

            // 儲存進度
            localStorage.setItem('ebook_progress_' + currentPdfUrl, pageNumber);

        } catch (err) {
            console.error(err);
        } finally {
            isRenderingPage = false;
        }
    }

    function movePage(direction) {
        if (!currentPdfDoc) return;
        let targetPage = currentPdfPage + direction;
        if (targetPage >= 1 && targetPage <= currentPdfDoc.numPages) {
            currentPdfPage = targetPage;
            renderBookPage(currentPdfPage);
        }
    }

    function handleSliderInput(val) {
        const pageNum = parseInt(val);
        if (pageNum >= 1 && pageNum <= currentPdfDoc.numPages) {
            currentPdfPage = pageNum;
            renderBookPage(currentPdfPage);
        }
    }

    function closeEbook() {
        document.getElementById('ebook-reader-window').style.display = 'none';
        currentPdfDoc = null;
    }

    // 動態異步抓取 PDF 第一頁作為首頁的小預覽縮圖
    async function makePdfThumbnail(pdfUrl, imgElementId) {
        try {
            if (typeof pdfjsLib === 'undefined') return;

            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            
            // 使用小比例 (0.3) 快速解碼封面，節省記憶體開銷
            const viewport = page.getViewport({ scale: 0.3 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            await page.render(renderContext).promise;
            
            const imgElement = document.getElementById(imgElementId);
            if (imgElement) {
                imgElement.src = canvas.toDataURL();
            }
        } catch (error) {
            console.warn("無法取得 PDF 首頁預覽圖 (原因可能為本機 file:// 的 CORS 限制):", error);
            // 當本機開啟或讀取失敗時，自動降級為 Apple Books 風格的灰色備用書本 ICON
            const imgElement = document.getElementById(imgElementId);
            if (imgElement) {
                imgElement.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'></path><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'></path></svg>";
            }
        }
    }

    // ==================== 📝 測驗系統核心業務邏輯 ====================
    async function initSystem() {
        // 同步加載電子書的封面預覽縮圖
        makePdfThumbnail('data/AI應用規劃師(初級)-學習指引-科目1_人工智慧基礎概論1141203_20251222172144.pdf', 'thumb-book1');
        makePdfThumbnail('data/AI應用規劃師(初級)-學習指引-科目2_生成式AI應用與規劃114123_20251222172159.pdf', 'thumb-book2');

        try {
            const mdResponse = await fetch('data/bank_list.md');
            if (!mdResponse.ok) throw new Error("Manifest (bank_list.md) response failed.");
            
            const mdText = await mdResponse.text();
            const lines = mdText.split('\n');
            const bankFilesToLoad = [];
            
            lines.forEach(line => {
                let cleanLine = line.trim().replace(/^[\-\*\+]\s+/, '');
                if (cleanLine && !cleanLine.startsWith('#') && cleanLine.endsWith('.json')) {
                    bankFilesToLoad.push(cleanLine);
                }
            });

            if (bankFilesToLoad.length === 0) throw new Error("No payload source specified.");
            await loadAllBanks(bankFilesToLoad);

        } catch (error) {
            console.error(error);
            const contentArea = document.getElementById('stage-loading');
            contentArea.innerHTML = `
                <div class="app-card" style="border-top: 4px solid var(--status-error); text-align: center; padding: 32px 16px;">
                    <div style="color: var(--status-error); font-weight: 600; margin-bottom: 8px;">系統配置載入中斷</div>
                    <div style="font-size: 13px; color: var(--text-secondary);">${error.message}</div>
                </div>
            `;
        }
    }

    async function loadAllBanks(bankFiles) {
        let successCount = 0;
        for (const filename of bankFiles) {
            try {
                const response = await fetch(`data/${filename}`);
                if (response.ok) {
                    const data = await response.json();
                    const displayName = filename.replace('.json', '');
                    loadedBanks[displayName] = data;
                    successCount++;
                }
            } catch (e) { console.error(`Failed to load: ${filename}`); }
        }

        if (successCount > 0) {
            renderConfigUI();
            setTimeout(() => showSection('stage-config'), 400);
        } else {
            const contentArea = document.getElementById('stage-loading');
            contentArea.innerHTML = `
                <div class="app-card" style="border-top: 4px solid var(--status-error); text-align: center; padding: 32px 16px;">
                    <div style="color: var(--status-error); font-weight: 600;">資料庫同步異常，請檢查遠端配置檔案。</div>
                </div>
            `;
        }
    }

    function renderConfigUI() {
        const container = document.getElementById('bank-list-container');
        let totalQuestionsAvailable = 0;
        container.innerHTML = '';

        for (const [displayName, questions] of Object.entries(loadedBanks)) {
            const count = questions.length;
            totalQuestionsAvailable += count;

            const div = document.createElement('div');
            div.className = 'setting-row';
            div.innerHTML = `
                <div>
                    <div style="font-size: 16px; font-weight: 500; color: var(--text-primary);">${displayName}</div>
                    <div style="font-size: 13px; color: var(--text-secondary); margin-top: 1px;">內含 ${count} 項題目</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" class="bank-checkbox" value="${displayName}" checked>
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(div);
        }

        const inputEl = document.getElementById('question-count');
        inputEl.max = totalQuestionsAvailable;
        inputEl.value = totalQuestionsAvailable < 10 ? totalQuestionsAvailable : 10;
    }

    function generateQuiz() {
        const checkboxes = document.querySelectorAll('.bank-checkbox:checked');
        let questionPool = [];

        checkboxes.forEach(cb => {
            const name = cb.value;
            const qWithSource = loadedBanks[name].map(q => ({...q, sourceBank: name}));
            questionPool = questionPool.concat(qWithSource);
        });

        if (questionPool.length === 0) {
            alert("請至少啟動一項測驗題目範圍設定。");
            return;
        }

        let count = parseInt(document.getElementById('question-count').value);
        if (isNaN(count) || count < 1) count = 1;
        count = Math.min(count, questionPool.length);
        
        let shuffled = [...questionPool].sort(() => Math.random() - 0.5);
        currentQuiz = shuffled.slice(0, count);
        
        renderQuiz();
        showSection('stage-quiz');
    }

    function selectOption(qIndex, key) {
        document.querySelectorAll(`.opt-group-${qIndex}`).forEach(el => {
            el.classList.remove('selected');
        });
        const selectedLabel = document.getElementById(`label-${qIndex}-${key}`);
        selectedLabel.classList.add('selected');
        document.getElementById(`radio-${qIndex}-${key}`).checked = true;
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        document.getElementById('quiz-header').innerText = `共 ${currentQuiz.length} 題`;

        currentQuiz.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'app-card';
            
            let optionsHtml = '';
            if (q.options && typeof q.options === 'object') {
                for (const [key, value] of Object.entries(q.options)) {
                    optionsHtml += `
                        <div class="option-container opt-group-${index}" id="label-${index}-${key}" onclick="selectOption(${index}, '${key}')">
                            <input type="radio" id="radio-${index}-${key}" name="q${index}" value="${key}">
                            <div class="option-badge">${key}</div>
                            <div class="option-text">${value}</div>
                        </div>
                    `;
                }
            }

            const catText = q.category || q.sourceBank;
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; margin-bottom: 10px; border-bottom: 0.5px solid var(--border-light); padding-bottom: 6px;">
                    <span>${catText}</span>
                    <span style="color:var(--text-muted);">REF: ${q.id || 'N/A'}</span>
                </div>
                <div style="font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text-primary); line-height: 1.4;">
                    <span style="color: var(--brand-primary); margin-right: 4px;">${index + 1}.</span>${q.question}
                </div>
                <div>${optionsHtml}</div>
                <div id="feedback-${index}" class="status-banner"></div>
            `;
            container.appendChild(card);
        });
    }

    function submitQuiz() {
        let score = 0;
        
        currentQuiz.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const feedback = document.getElementById(`feedback-${index}`);
            const ansKey = q.answer; 
            
            const correctLabel = document.getElementById(`label-${index}-${ansKey}`);
            if (correctLabel) correctLabel.classList.add('correct');

            feedback.className = 'status-banner show';

            const svgCorrect = `<svg class="svg-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            const svgWrong = `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
            const svgWarn = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;

            if (selected) {
                if (selected.value === ansKey) {
                    score++;
                    feedback.innerHTML = `${svgCorrect} <span>答題正確</span>`;
                    feedback.classList.add('correct');
                } else {
                    feedback.innerHTML = `${svgWrong} <span>作答錯誤，正確答案為 (${ansKey})</span>`;
                    feedback.classList.add('wrong');
                    document.getElementById(`label-${index}-${selected.value}`).classList.add('wrong');
                }
            } else {
                feedback.innerHTML = `${svgWarn} <span>未作答，正確答案為 (${ansKey})</span>`;
                feedback.classList.add('unanswered');
            }
            
            document.querySelectorAll(`.opt-group-${index}`).forEach(el => el.onclick = null);
        });

        const finalScore = Math.round((score / currentQuiz.length) * 100);
        
        document.getElementById('result-score').innerText = finalScore;
        document.getElementById('result-details').innerText = `正確率：${score} / ${currentQuiz.length}`;
        
        showSection('stage-result');
    }

    window.onload = initSystem;
</script>
</body>
